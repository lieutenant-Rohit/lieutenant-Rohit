<svg xmlns="http://www.w3.org/2000/svg" width="65" height="65" viewBox="0 0 65 65">
  <defs>
    <linearGradient id="sqlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00758F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F29111;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32.5" cy="32.5" r="30" fill="#161B22" stroke="url(#sqlGrad)" stroke-width="2">
    <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- SQL text -->
  <text x="32.5" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#sqlGrad)" filter="url(#glow)">
    SQL
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </text>
  
  <!-- Animated ring -->
  <circle cx="32.5" cy="32.5" r="28" fill="none" stroke="#00758F" stroke-width="1" stroke-dasharray="5,5">
    <animateTransform attributeName="transform" type="rotate" from="0 32.5 32.5" to="360 32.5 32.5" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>