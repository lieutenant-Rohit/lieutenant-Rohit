<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bg)" stroke="#00ff00" stroke-width="1" opacity="0.8"/>
  
  <!-- Rain Column 1 -->
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="30" y="-20">0
    <animate attributeName="y" from="-20" to="320" dur="2s" repeatCount="indefinite"/>
  </text>
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="30" y="-80">1
    <animate attributeName="y" from="-80" to="320" dur="2s" repeatCount="indefinite" begin="0.6s"/>
  </text>
  
  <!-- Rain Column 2 -->
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="60" y="-40">1
    <animate attributeName="y" from="-40" to="320" dur="2.3s" repeatCount="indefinite" begin="0.2s"/>
  </text>
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="60" y="-100">0
    <animate attributeName="y" from="-100" to="320" dur="2.3s" repeatCount="indefinite" begin="0.8s"/>
  </text>
  
  <!-- Rain Column 3 -->
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="90" y="-10">0
    <animate attributeName="y" from="-10" to="320" dur="1.9s" repeatCount="indefinite" begin="0.4s"/>
  </text>
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="90" y="-70">1
    <animate attributeName="y" from="-70" to="320" dur="1.9s" repeatCount="indefinite" begin="1s"/>
  </text>
  
  <!-- Rain Column 4 -->
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="120" y="-50">1
    <animate attributeName="y" from="-50" to="320" dur="2.5s" repeatCount="indefinite" begin="0.1s"/>
  </text>
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="120" y="-110">0
    <animate attributeName="y" from="-110" to="320" dur="2.5s" repeatCount="indefinite" begin="0.7s"/>
  </text>
  
  <!-- Rain Column 5 -->
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="150" y="-25">0
    <animate attributeName="y" from="-25" to="320" dur="2.1s" repeatCount="indefinite" begin="0.3s"/>
  </text>
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="150" y="-85">1
    <animate attributeName="y" from="-85" to="320" dur="2.1s" repeatCount="indefinite" begin="0.9s"/>
  </text>
  
  <!-- Rain Column 6 -->
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="180" y="-35">1
    <animate attributeName="y" from="-35" to="320" dur="2.4s" repeatCount="indefinite" begin="0.5s"/>
  </text>
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="180" y="-95">0
    <animate attributeName="y" from="-95" to="320" dur="2.4s" repeatCount="indefinite" begin="1.1s"/>
  </text>
  
  <!-- Rain Column 7 -->
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="210" y="-15">0
    <animate attributeName="y" from="-15" to="320" dur="1.8s" repeatCount="indefinite" begin="0.2s"/>
  </text>
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="210" y="-75">1
    <animate attributeName="y" from="-75" to="320" dur="1.8s" repeatCount="indefinite" begin="0.8s"/>
  </text>
  
  <!-- Rain Column 8 -->
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="240" y="-45">1
    <animate attributeName="y" from="-45" to="320" dur="2.2s" repeatCount="indefinite" begin="0.4s"/>
  </text>
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="240" y="-105">0
    <animate attributeName="y" from="-105" to="320" dur="2.2s" repeatCount="indefinite" begin="1s"/>
  </text>
  
  <!-- Rain Column 9 -->
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="270" y="-20">0
    <animate attributeName="y" from="-20" to="320" dur="2.6s" repeatCount="indefinite" begin="0.1s"/>
  </text>
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="270" y="-80">1
    <animate attributeName="y" from="-80" to="320" dur="2.6s" repeatCount="indefinite" begin="0.7s"/>
  </text>
  
  <!-- Rain Column 10 -->
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="300" y="-30">1
    <animate attributeName="y" from="-30" to="320" dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </text>
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="300" y="-90">0
    <animate attributeName="y" from="-90" to="320" dur="2s" repeatCount="indefinite" begin="0.9s"/>
  </text>
  
  <!-- Rain Column 11 -->
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="330" y="-25">0
    <animate attributeName="y" from="-25" to="320" dur="2.3s" repeatCount="indefinite" begin="0.5s"/>
  </text>
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="330" y="-85">1
    <animate attributeName="y" from="-85" to="320" dur="2.3s" repeatCount="indefinite" begin="1.1s"/>
  </text>
  
  <!-- Rain Column 12 -->
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="360" y="-40">1
    <animate attributeName="y" from="-40" to="320" dur="1.9s" repeatCount="indefinite" begin="0.2s"/>
  </text>
  <text font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)" x="360" y="-100">0
    <animate attributeName="y" from="-100" to="320" dur="1.9s" repeatCount="indefinite" begin="0.8s"/>
  </text>
  
  <!-- Center text box -->
  <rect x="100" y="120" width="200" height="60" rx="8" fill="#001100" stroke="#00ff00" stroke-width="2"/>
  <text x="200" y="148" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#00ff00" filter="url(#glow)">
    <tspan>MATRIX</tspan>
  </text>
  <text x="200" y="168" text-anchor="middle" font-family="monospace" font-size="11" fill="#00ff00">
    <tspan>NEO@ZION:~$</tspan>
  </text>
  
  <!-- Blinking cursor -->
  <rect x="275" y="158" width="8" height="12" fill="#00ff00">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>