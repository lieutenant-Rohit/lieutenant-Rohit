<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bg)" stroke="#00ff00" stroke-width="1" opacity="0.8"/>
  
  <!-- Matrix rain - Column 1 falling -->
  <g font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)">
    <text x="30">0</text>
    <animate attributeName="y" values="-20;320" dur="2s" repeatCount="indefinite"/>
    <text x="30">1</text>
    <animate attributeName="y" values="-40;300" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    <text x="30">1</text>
    <animate attributeName="y" values="-60;280" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    <text x="30">0</text>
    <animate attributeName="y" values="-80;260" dur="2s" repeatCount="indefinite" begin="0.9s"/>
  </g>
  
  <!-- Matrix rain - Column 2 falling -->
  <g font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)">
