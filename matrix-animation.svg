<svg xmlns="http://www.w3.org/2000/svg" width="300" height="250" viewBox="0 0 300 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="250" rx="16" fill="url(#bg)" stroke="#00ff00" stroke-width="1" opacity="0.8"/>
  
  <!-- Matrix rain columns -->
  <g font-family="monospace" font-size="12" fill="#00ff00" filter="url(#glow)">
    <!-- Column 1 -->
    <text x="20" y="20" opacity="0.8">0</text>
    <text x="20" y="35" opacity="0.7">1</text>
    <text x="20" y="50" opacity="0.6">0</text>
    <text x="20" y="65" opacity="0.5">1</text>
    <text x="20" y="80" opacity="0.4">1</text>
    <text x="20" y="95" opacity="0.3">0</text>
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    
    <!-- Column 2 -->
    <text x="45" y="30" opacity="0.7">1</text>
    <text x="45" y="45" opacity="0.6">0</text>
    <text x="45" y="60" opacity="0.5">1</text>
    <text x="45" y="75" opacity="0.4">0</text>
    <text x="45" y="90" opacity="0.3">1</text>
    <text x="45" y="105" opacity="0.2">0</text>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    
    <!-- Column 3 -->
    <text x="70" y="15" opacity="0.9">1</text>
    <text x="70" y="30" opacity="0.8">0</text>
    <text x="70" y="45" opacity="0.7">1</text>
    <text x="70" y="60" opacity="0.6">0</text>
    <text x="70" y="75" opacity="0.5">1</text>
    <text x="70" y="90" opacity="0.4">0</text>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    
    <!-- Column 4 -->
    <text x="95" y="25" opacity="0.6">0</text>
    <text x="95" y="40" opacity="0.5">1</text>
    <text x="95" y="55" opacity="0.4">0</text>
    <text x="95" y="70" opacity="0.3">1</text>
    <text x="95" y="85" opacity="0.2">0</text>
    <text x="95" y="100" opacity="0.1">1</text>
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    
    <!-- Column 5 -->
    <text x="120" y="10" opacity="0.8">1</text>
    <text x="120" y="25" opacity="0.7">0</text>
    <text x="120" y="40" opacity="0.6">1</text>
    <text x="120" y="55" opacity="0.5">0</text>
    <text x="120" y="70" opacity="0.4">1</text>
    <text x="120" y="85" opacity="0.3">0</text>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    
    <!-- Column 6 -->
    <text x="145" y="35" opacity="0.7">0</text>
    <text x="145" y="50" opacity="0.6">1</text>
    <text x="145" y="65" opacity="0.5">0</text>
    <text x="145" y="80" opacity="0.4">1</text>
    <text x="145" y="95" opacity="0.3">0</text>
    <text x="145" y="110" opacity="0.2">1</text>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    
    <!-- Column 7 -->
    <text x="170" y="20" opacity="0.9">1</text>
    <text x="170" y="35" opacity="0.8">0</text>
    <text x="170" y="50" opacity="0.7">1</text>
    <text x="170" y="65" opacity="0.6">0</text>
    <text x="170" y="80" opacity="0.5">1</text>
    <text x="170" y="95" opacity="0.4">0</text>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    
    <!-- Column 8 -->
    <text x="195" y="30" opacity="0.6">0</text>
    <text x="195" y="45" opacity="0.5">1</text>
    <text x="195" y="60" opacity="0.4">0</text>
    <text x="195" y="75" opacity="0.3">1</text>
    <text x="195" y="90" opacity="0.2">0</text>
    <text x="195" y="105" opacity="0.1">1</text>
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    
    <!-- Column 9 -->
    <text x="220" y="15" opacity="0.8">1</text>
    <text x="220" y="30" opacity="0.7">0</text>
    <text x="220" y="45" opacity="0.6">1</text>
    <text x="220" y="60" opacity="0.5">0</text>
    <text x="220" y="75" opacity="0.4">1</text>
    <text x="220" y="90" opacity="0.3">0</text>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    
    <!-- Column 10 -->
    <text x="245" y="25" opacity="0.7">0</text>
    <text x="245" y="40" opacity="0.6">1</text>
    <text x="245" y="55" opacity="0.5">0</text>
    <text x="245" y="70" opacity="0.4">1</text>
    <text x="245" y="85" opacity="0.3">0</text>
    <text x="245" y="100" opacity="0.2">1</text>
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    
    <!-- Column 11 -->
    <text x="270" y="10" opacity="0.9">1</text>
    <text x="270" y="25" opacity="0.8">0</text>
    <text x="270" y="40" opacity="0.7">1</text>
    <text x="270" y="55" opacity="0.6">0</text>
    <text x="270" y="70" opacity="0.5">1</text>
    <text x="270" y="85" opacity="0.4">0</text>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </g>
  
  <!-- Center text -->
  <text x="150" y="140" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#00ff00" filter="url(#glow)">
    <tspan>CODING</tspan>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="160" text-anchor="middle" font-family="monospace" font-size="12" fill="#00ff00" filter="url(#glow)">
    <tspan>IN THE MATRIX</tspan>
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </text>
  
  <!-- Bottom bar -->
  <rect x="10" y="200" width="280" height="40" rx="8" fill="#001100" stroke="#00ff00" stroke-width="1" opacity="0.5"/>
  <text x="150" y="225" text-anchor="middle" font-family="monospace" font-size="11" fill="#00ff00">
    <tspan>while(alive) { code(); }</tspan>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </text>
  
  <!-- Falling characters animation -->
  <g font-family="monospace" font-size="10" fill="#00ff00" opacity="0.6">
    <text x="30" y="120">a</text>
    <animate attributeName="y" values="120;200;120" dur="3s" repeatCount="indefinite"/>
    <text x="80" y="100">b</text>
    <animate attributeName="y" values="100;200;100" dur="2.5s" repeatCount="indefinite"/>
    <text x="130" y="130">c</text>
    <animate attributeName="y" values="130;200;130" dur="2.8s" repeatCount="indefinite"/>
    <text x="180" y="110">d</text>
    <animate attributeName="y" values="110;200;110" dur="3.2s" repeatCount="indefinite"/>
    <text x="230" y="140">e</text>
    <animate attributeName="y" values="140;200;140" dur="2.7s" repeatCount="indefinite"/>
  </g>
</svg>