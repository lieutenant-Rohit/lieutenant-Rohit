<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Falling animation -->
    <style>
      @keyframes fall {
        0% { transform: translateY(-50px); opacity: 1; }
        100% { transform: translateY(350px); opacity: 0.3; }
      }
      .rain { animation: fall linear infinite; }
      .r1 { animation-duration: 2s; }
      .r2 { animation-duration: 2.5s; }
      .r3 { animation-duration: 1.8s; }
      .r4 { animation-duration: 3s; }
      .r5 { animation-duration: 2.2s; }
      .blink { animation: blink 1s step-end infinite; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bg)" stroke="#00ff00" stroke-width="1" opacity="0.8"/>
  
  <!-- Rain columns -->
  <g font-family="monospace" font-size="14" fill="#00ff00" filter="url(#glow)">
    <!-- Column 1 -->
    <text class="rain r1" x="30" y="-20" style="animation-delay: 0s;">0</text>
    <text class="rain r1" x="30" y="-60" style="animation-delay: 0.5s;">1</text>
    <text class="rain r1" x="30" y="-100" style="animation-delay: 1s;">0</text>
    
    <!-- Column 2 -->
    <text class="rain r2" x="60" y="-30" style="animation-delay: 0.2s;">1</text>
    <text class="rain r2" x="60" y="-70" style="animation-delay: 0.7s;">0</text>
    <text class="rain r2" x="60" y="-110" style="animation-delay: 1.2s;">1</text>
    
    <!-- Column 3 -->
    <text class="rain r3" x="90" y="-10" style="animation-delay: 0.4s;">0</text>
    <text class="rain r3" x="90" y="-50" style="animation-delay: 0.9s;">1</text>
    <text class="rain r3" x="90" y="-90" style="animation-delay: 1.4s;">0</text>
    
    <!-- Column 4 -->
    <text class="rain r4" x="120" y="-40" style="animation-delay: 0.1s;">1</text>
    <text class="rain r4" x="120" y="-80" style="animation-delay: 0.6s;">0</text>
    <text class="rain r4" x="120" y="-120" style="animation-delay: 1.1s;">1</text>
    
    <!-- Column 5 -->
    <text class="rain r5" x="150" y="-25" style="animation-delay: 0.3s;">0</text>
    <text class="rain r5" x="150" y="-65" style="animation-delay: 0.8s;">1</text>
    <text class="rain r5" x="150" y="-105" style="animation-delay: 1.3s;">0</text>
    
    <!-- Column 6 -->
    <text class="rain r1" x="180" y="-35" style="animation-delay: 0.5s;">1</text>
    <text class="rain r1" x="180" y="-75" style="animation-delay: 1s;">0</text>
    <text class="rain r1" x="180" y="-115" style="animation-delay: 1.5s;">1</text>
    
    <!-- Column 7 -->
    <text class="rain r2" x="210" y="-15" style="animation-delay: 0.2s;">0</text>
    <text class="rain r2" x="210" y="-55" style="animation-delay: 0.7s;">1</text>
    <text class="rain r2" x="210" y="-95" style="animation-delay: 1.2s;">0</text>
    
    <!-- Column 8 -->
    <text class="rain r3" x="240" y="-45" style="animation-delay: 0.4s;">1</text>
    <text class="rain r3" x="240" y="-85" style="animation-delay: 0.9s;">0</text>
    <text class="rain r3" x="240" y="-125" style="animation-delay: 1.4s;">1</text>
    
    <!-- Column 9 -->
    <text class="rain r4" x="270" y="-20" style="animation-delay: 0.1s;">0</text>
    <text class="rain r4" x="270" y="-60" style="animation-delay: 0.6s;">1</text>
    <text class="rain r4" x="270" y="-100" style="animation-delay: 1.1s;">0</text>
    
    <!-- Column 10 -->
    <text class="rain r5" x="300" y="-30" style="animation-delay: 0.3s;">1</text>
    <text class="rain r5" x="300" y="-70" style="animation-delay: 0.8s;">0</text>
    <text class="rain r5" x="300" y="-110" style="animation-delay: 1.3s;">1</text>
    
    <!-- Column 11 -->
    <text class="rain r1" x="330" y="-25" style="animation-delay: 0.5s;">0</text>
    <text class="rain r1" x="330" y="-65" style="animation-delay: 1s;">1</text>
    <text class="rain r1" x="330" y="-105" style="animation-delay: 1.5s;">0</text>
    
    <!-- Column 12 -->
    <text class="rain r2" x="360" y="-40" style="animation-delay: 0.2s;">1</text>
    <text class="rain r2" x="360" y="-80" style="animation-delay: 0.7s;">0</text>
    <text class="rain r2" x="360" y="-120" style="animation-delay: 1.2s;">1</text>
  </g>
  
  <!-- Center text box -->
  <rect x="100" y="120" width="200" height="60" rx="8" fill="#001100" stroke="#00ff00" stroke-width="2"/>
  <text x="200" y="148" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#00ff00" filter="url(#glow)">
    <tspan>MATRIX</tspan>
  </text>
  <text x="200" y="168" text-anchor="middle" font-family="monospace" font-size="11" fill="#00ff00">
    <tspan>NEO@ZION:~$</tspan>
  </text>
  
  <!-- Blinking cursor -->
  <rect class="blink" x="275" y="158" width="8" height="12" fill="#00ff00"/>
</svg>