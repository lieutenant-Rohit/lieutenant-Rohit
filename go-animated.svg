<svg xmlns="http://www.w3.org/2000/svg" width="65" height="65" viewBox="0 0 65 65">
  <defs>
    <linearGradient id="goGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ADD8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A29C;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32.5" cy="32.5" r="30" fill="#161B22" stroke="url(#goGrad)" stroke-width="2">
    <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Go gopher inspired - simplified -->
  <circle cx="32.5" cy="30" r="12" fill="url(#goGrad)">
    <animate attributeName="r" values="12;13;12" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Eyes -->
  <circle cx="28" cy="28" r="2" fill="#161B22"/>
  <circle cx="37" cy="28" r="2" fill="#161B22"/>
  
  <!-- Go text -->
  <text x="32.5" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#goGrad)" filter="url(#glow)">
    Go
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </text>
  
  <!-- Animated ring -->
  <circle cx="32.5" cy="32.5" r="28" fill="none" stroke="#00ADD8" stroke-width="1" stroke-dasharray="5,5">
    <animateTransform attributeName="transform" type="rotate" from="0 32.5 32.5" to="360 32.5 32.5" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>