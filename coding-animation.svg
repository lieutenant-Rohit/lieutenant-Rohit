<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3FB950;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58A6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFA116;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F75C7E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" rx="16" fill="url(#bg)" stroke="#30363D" stroke-width="1"/>
  
  <!-- Laptop base -->
  <rect x="90" y="120" width="120" height="8" rx="2" fill="#30363D"/>
  
  <!-- Laptop screen -->
  <rect x="100" y="60" width="100" height="60" rx="4" fill="#161B22" stroke="#30363D" stroke-width="2"/>
  
  <!-- Screen content - code lines -->
  <rect x="110" y="70" width="40" height="3" rx="1" fill="#3FB950" opacity="0.7">
    <animate attributeName="width" values="40;60;40" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="110" y="78" width="55" height="3" rx="1" fill="#58A6FF" opacity="0.7">
    <animate attributeName="width" values="55;35;55" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="110" y="86" width="30" height="3" rx="1" fill="#FFA116" opacity="0.7">
    <animate attributeName="width" values="30;50;30" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="110" y="94" width="45" height="3" rx="1" fill="#C084FC" opacity="0.7">
    <animate attributeName="width" values="45;25;45" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="110" y="102" width="35" height="3" rx="1" fill="#F75C7E" opacity="0.7">
    <animate attributeName="width" values="35;55;35" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Cursor blink -->
  <rect x="110" y="110" width="2" height="6" fill="#3FB950">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Text - Eat Sleep Code Repeat -->
  <text x="150" y="30" text-anchor="middle" font-family="monospace" font-size="12" fill="url(#text1)" filter="url(#glow)">
    <tspan>EAT</tspan>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="45" text-anchor="middle" font-family="monospace" font-size="12" fill="url(#text2)" filter="url(#glow)">
    <tspan>SLEEP</tspan>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="155" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="url(#text1)" filter="url(#glow)">
    <tspan>CODE</tspan>
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="175" text-anchor="middle" font-family="monospace" font-size="12" fill="url(#text2)" filter="url(#glow)">
    <tspan>REPEAT</tspan>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </text>
  
  <!-- Decorative dots -->
  <circle cx="30" cy="180" r="3" fill="#3FB950" opacity="0.5">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="180" r="3" fill="#58A6FF" opacity="0.5">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="70" cy="180" r="3" fill="#FFA116" opacity="0.5">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="230" cy="180" r="3" fill="#C084FC" opacity="0.5">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
  </circle>
  <circle cx="250" cy="180" r="3" fill="#F75C7E" opacity="0.5">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <circle cx="270" cy="180" r="3" fill="#3FB950" opacity="0.5">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
</svg>