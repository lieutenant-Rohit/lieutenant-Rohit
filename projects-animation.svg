<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pulse1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3FB950;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#3FB950;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3FB950;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="pulse2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58A6FF;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#58A6FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#58A6FF;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="pulse3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFA116;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#FFA116;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFA116;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="pulse4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C084FC;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#C084FC;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#C084FC;stop-opacity:0.2" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" rx="16" fill="url(#bg)" stroke="#30363D" stroke-width="1"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="monospace" font-size="18" fill="#E0E7FF" font-weight="bold">🚀 Featured Projects</text>
  
  <!-- Project 1 - MeshPay -->
  <g transform="translate(40, 60)">
    <rect width="160" height="100" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="80" cy="40" r="20" fill="none" stroke="url(#pulse1)" stroke-width="2">
      <animate attributeName="r" values="15;25;15" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="45" text-anchor="middle" font-size="20">📡</text>
    <text x="80" y="75" text-anchor="middle" font-family="monospace" font-size="10" fill="#3FB950">MeshPay</text>
    <text x="80" y="90" text-anchor="middle" font-family="monospace" font-size="8" fill="#8B949E">Offline UPI</text>
  </g>
  
  <!-- Project 2 - BloomsCafe -->
  <g transform="translate(220, 60)">
    <rect width="160" height="100" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="80" cy="40" r="20" fill="none" stroke="url(#pulse2)" stroke-width="2">
      <animate attributeName="r" values="15;25;15" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <text x="80" y="45" text-anchor="middle" font-size="20">🌸</text>
    <text x="80" y="75" text-anchor="middle" font-family="monospace" font-size="10" fill="#58A6FF">BloomsCafe</text>
    <text x="80" y="90" text-anchor="middle" font-family="monospace" font-size="8" fill="#8B949E">E-commerce</text>
  </g>
  
  <!-- Project 3 - ChaosCraft -->
  <g transform="translate(400, 60)">
    <rect width="160" height="100" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="80" cy="40" r="20" fill="none" stroke="url(#pulse3)" stroke-width="2">
      <animate attributeName="r" values="15;25;15" dur="2s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <text x="80" y="45" text-anchor="middle" font-size="20">🎮</text>
    <text x="80" y="75" text-anchor="middle" font-family="monospace" font-size="10" fill="#FFA116">ChaosCraft</text>
    <text x="80" y="90" text-anchor="middle" font-family="monospace" font-size="8" fill="#8B949E">Chaos Eng</text>
  </g>
  
  <!-- Project 4 - Rex -->
  <g transform="translate(580, 60)">
    <rect width="160" height="100" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="80" cy="40" r="20" fill="none" stroke="url(#pulse4)" stroke-width="2">
      <animate attributeName="r" values="15;25;15" dur="2s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <text x="80" y="45" text-anchor="middle" font-size="20">🦖</text>
    <text x="80" y="75" text-anchor="middle" font-family="monospace" font-size="10" fill="#C084FC">Rex</text>
    <text x="80" y="90" text-anchor="middle" font-family="monospace" font-size="8" fill="#8B949E">Git VCS</text>
  </g>
  
  <!-- Animated scanning line -->
  <line x1="40" y1="200" x2="760" y2="200" stroke="#30363D" stroke-width="1"/>
  <rect x="40" y="195" width="100" height="10" fill="url(#pulse1)" rx="5">
    <animate attributeName="x" values="40;660;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Tech stack labels -->
  <text x="400" y="230" text-anchor="middle" font-family="monospace" font-size="11" fill="#8B949E">
    <tspan fill="#007396">Java</tspan> · 
    <tspan fill="#6DB33F">Spring Boot</tspan> · 
    <tspan fill="#61DAFB">React</tspan> · 
    <tspan fill="#DC382D">Redis</tspan> · 
    <tspan fill="#2496ED">Docker</tspan>
  </text>
  
  <!-- Animated dots -->
  <circle cx="100" cy="260" r="3" fill="#3FB950" opacity="0.5">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="260" r="3" fill="#58A6FF" opacity="0.5">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="500" cy="260" r="3" fill="#FFA116" opacity="0.5">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="700" cy="260" r="3" fill="#C084FC" opacity="0.5">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
  </circle>
  
  <!-- Bottom text -->
  <text x="400" y="285" text-anchor="middle" font-family="monospace" font-size="10" fill="#484F58">Click any project to explore →</text>
</svg>