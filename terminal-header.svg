<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="animated terminal header">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C084FC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- background -->
  <rect x="0" y="0" width="800" height="200" rx="16" fill="url(#bgGradient)"/>
  
  <!-- subtle pattern overlay -->
  <rect x="0" y="0" width="800" height="200" rx="16" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- title bar -->
  <rect x="0" y="0" width="800" height="45" rx="16" fill="rgba(0,0,0,0.3)"/>
  <rect x="0" y="30" width="800" height="15" fill="rgba(0,0,0,0.3)"/>
  
  <!-- traffic light dots -->
  <circle cx="30" cy="22" r="8" fill="#FF5F56" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="55" cy="22" r="8" fill="#FFBD2E" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="80" cy="22" r="8" fill="#27C93F" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  
  <!-- window label -->
  <text x="400" y="28" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="rgba(255,255,255,0.7)">rohit@dev:~</text>
  
  <!-- main text - animated -->
  <text x="40" y="110" font-family="'SF Mono', 'Fira Code', monospace" font-size="32" font-weight="bold" fill="white" filter="url(#glow)">
    $ echo "Hello, World!" 👋
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
      values="0;1;1;0;0" keyTimes="0;0.1;0.45;0.5;1"/>
  </text>
  
  <text x="40" y="110" font-family="'SF Mono', 'Fira Code', monospace" font-size="32" font-weight="bold" fill="white" filter="url(#glow)">
    > Building offline-first systems
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
      values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.95;1"/>
  </text>
  
  <!-- subtitle -->
  <text x="40" y="150" font-family="'SF Mono', 'Fira Code', monospace" font-size="16" fill="rgba(255,255,255,0.8)">
    Backend Developer · MCA Student · Open to SDE Internships
  </text>
  
  <!-- decorative dots -->
  <circle cx="750" cy="180" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="770" cy="180" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="790" cy="180" r="3" fill="rgba(255,255,255,0.3)"/>
</svg>