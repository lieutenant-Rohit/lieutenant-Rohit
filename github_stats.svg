<svg xmlns="http://www.w3.org/2000/svg" width="450" height="200" viewBox="0 0 450 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="450" height="200" rx="10" fill="url(#bg)" stroke="#30363D" stroke-width="1"/>
  
  <!-- Title bar -->
  <rect width="450" height="30" rx="10" fill="#161B22"/>
  <rect y="20" width="450" height="10" fill="#161B22"/>
  
  <!-- Traffic lights -->
  <circle cx="20" cy="15" r="5" fill="#FF5F56"/>
  <circle cx="40" cy="15" r="5" fill="#FFBD2E"/>
  <circle cx="60" cy="15" r="5" fill="#27C93F"/>
  
  <!-- Terminal title -->
  <text x="225" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#8B949E">rohit@dev:~</text>
  
  <!-- Stats content -->
  <text x="20" y="55" font-family="monospace" font-size="14" fill="#7AA2F7">$</text>
  <text x="35" y="55" font-family="monospace" font-size="14" fill="#E0E7FF"> gh stats --user lieutenant-Rohit</text>
  
  <!-- Line separator -->
  <line x1="20" y1="65" x2="430" y2="65" stroke="#30363D" stroke-width="1"/>
  
  <!-- Repos -->
  <text x="20" y="85" font-family="monospace" font-size="12" fill="#8B949E">📦 Repositories:</text>
  <text x="400" y="85" font-family="monospace" font-size="12" fill="#3FB950" text-anchor="end">5+</text>
  
  <!-- Stars -->
  <text x="20" y="105" font-family="monospace" font-size="12" fill="#8B949E">⭐ Stars:</text>
  <text x="400" y="105" font-family="monospace" font-size="12" fill="#FFBD2E" text-anchor="end">10+</text>
  
  <!-- Commits -->
  <text x="20" y="125" font-family="monospace" font-size="12" fill="#8B949E">💻 Commits:</text>
  <text x="400" y="125" font-family="monospace" font-size="12" fill="#7AA2F7" text-anchor="end">200+</text>
  
  <!-- Followers -->
  <text x="20" y="145" font-family="monospace" font-size="12" fill="#8B949E">👥 Followers:</text>
  <text x="400" y="145" font-family="monospace" font-size="12" fill="#C084FC" text-anchor="end">50+</text>
  
  <!-- LeetCode -->
  <text x="20" y="165" font-family="monospace" font-size="12" fill="#8B949E">🏆 LeetCode:</text>
  <text x="400" y="165" font-family="monospace" font-size="12" fill="#FFA116" text-anchor="end">767+ solved</text>
  
  <!-- Cursor -->
  <rect x="20" y="180" width="8" height="14" fill="#3FB950">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Bottom bar -->
  <rect y="190" width="450" height="10" rx="0" fill="#161B22"/>
  <rect x="0" y="190" width="450" height="1" fill="#30363D"/>
</svg>